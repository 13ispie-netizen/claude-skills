<!doctype html><html><head><meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#282739;font-family:'Public Sans',Arial,sans-serif;color:#fff}
.slide{position:relative;width:1920px;height:1080px;background:#282739;overflow:hidden;padding:72px 108px;display:flex;flex-direction:column}
.glow{position:absolute;border-radius:50%;pointer-events:none;z-index:0}
.bl{width:680px;height:680px;bottom:-280px;left:-280px;background:radial-gradient(circle,rgba(245,161,125,0.28) 0%,rgba(245,161,125,0.07) 50%,transparent 70%)}
.tr{width:560px;height:560px;top:-230px;right:-230px;background:radial-gradient(circle,rgba(244,191,95,0.28) 0%,rgba(244,191,95,0.07) 50%,transparent 70%)}
.c{position:relative;z-index:1}
.eyebrow{color:#f5a17d;font-weight:400;font-size:26px;margin-bottom:14px}
h1{color:#f5a17d;font-weight:900;font-size:76px;line-height:1.02;margin-bottom:22px}
.bar{width:56px;height:3px;background:#f5a17d;margin-bottom:48px}
.thermo{position:relative;height:140px;width:100%;margin:20px 0 8px}
.tube{position:absolute;left:100px;right:0;top:37px;height:66px;border-radius:33px;background:rgba(255,255,255,0.08);border:2px solid rgba(255,255,255,0.18);overflow:hidden}
.fill{position:absolute;top:0;bottom:0;left:0}
.bulb{position:absolute;left:0;top:0;width:140px;height:140px;border-radius:50%;background:#f5a17d;border:2px solid rgba(255,255,255,0.18)}
.neck{position:absolute;left:110px;top:39px;height:62px;width:40px;background:#f5a17d}
.scale{display:flex;justify-content:space-between;margin-left:100px;font-weight:300;font-size:22px;color:rgba(255,255,255,0.45);margin-bottom:56px}
.legend{display:grid;grid-template-columns:repeat(4,1fr);column-gap:48px}
.item{display:flex;gap:16px;align-items:flex-start}
.dot{width:14px;height:14px;border-radius:50%;flex-shrink:0;margin-top:14px}
.lbl{font-weight:300;font-size:26px}
.amt{font-weight:900;font-size:58px;line-height:1.1}
.sub{font-weight:300;font-size:21px;color:rgba(255,255,255,0.45);margin-top:6px}
.footer{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:flex-end;margin-top:auto}
.url{font-weight:300;font-size:16px;color:rgba(255,255,255,0.25)}
.footer img{width:72px;height:72px;object-fit:contain;opacity:0.85}
</style></head><body>
<div class="slide">
<div class="glow bl"></div><div class="glow tr"></div>
<div class="c">

<div class="bar"></div>
</div>

  </div>
